name: Update current year

on:
  schedule:
    - cron: "0 0 1 1 *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-year:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update year in README
        run: |
          YEAR=$(date +'%Y')

          sed -i -E \
            "s|(<!-- CURRENT_YEAR -->)[0-9]{4}(<!-- /CURRENT_YEAR -->)|\1${YEAR}\2|g" \
            README.md

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "Year is already up to date"
            exit 0
          fi

          git add README.md
          git commit -m "Update profile year to $(date +'%Y')"
          git push
